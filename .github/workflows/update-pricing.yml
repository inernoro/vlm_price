name: Update pricing

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Refresh public pricing
        run: node scripts/update-pricing.mjs
      - name: Commit changed snapshot
        run: |
          if git diff --quiet -- README.md data/live-pricing.json; then
            echo "No pricing changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md data/live-pricing.json
          git commit -m "chore: refresh VLM pricing"
          git push
